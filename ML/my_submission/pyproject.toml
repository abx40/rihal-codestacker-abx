[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docfusion-baseline"
version = "0.1.0"
description = "Baseline submission for CodeStacker 2026 DocFusion challenge"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "numpy>=2.0.0",
  "scikit-learn>=1.5.0",
  "Pillow>=10.4.0",
  "streamlit>=1.42.0",
  "datasets>=3.2.0",
]

[project.optional-dependencies]
dev = [
  "jupyter>=1.1.1",
  "matplotlib>=3.9.0",
  "pandas>=2.2.0",
]
